[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "carets"
version = "0.2.0"
description = "A dependency-free asyncio TUI toolkit for Python"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND Unicode-3.0"
license-files = ["LICENSE", "UNICODE_LICENSE.txt"]
authors = [{name = "Wispsy"}]
dependencies = []

[project.urls]
Source = "https://github.com/wispsy/carets"
Issues = "https://github.com/wispsy/carets/issues"
Documentation = "https://github.com/wispsy/carets/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
