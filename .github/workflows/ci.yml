name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      # Original source experiments use Python 3.12 syntax; the package keeps 3.10.
      - run: python -m compileall -q -x prototypes src tests examples
      - if: matrix.python-version == '3.12' || matrix.python-version == '3.13'
        run: python -m compileall -q examples/prototypes

  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.10'}
          - {os: ubuntu-latest, python: '3.14'}
          - {os: macos-latest, python: '3.14'}
          - {os: windows-latest, python: '3.14'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv
      - run: uv build --out-dir dist
      - run: python scripts/qualify.py dist

